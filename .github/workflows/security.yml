name: Security

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scan:
    name: Secrets and dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check that the full history is present
        run: test "$(git rev-list --count HEAD)" -gt 1

      - name: Download gitleaks 8.30.1
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan all commits for secrets
        run: ./gitleaks git . --no-banner --redact

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # The findings are collected here, not judged: the judgement happens in ci.yml on push
      # and pull request from high on. This run only turns red when gitleaks finds a secret.
      - name: Collect dependency findings from moderate on
        run: |
          bash scripts/audit.sh moderate > audit.txt 2>&1 || true
          { echo '### npm audit, from moderate on'; echo '```'; cat audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Report the findings in one issue, only when they change
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/security-report.sh audit.txt
