name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NG_CLI_ANALYTICS: false

jobs:
  checks:
    name: Audit, format, file length, lint and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Known vulnerabilities from high on stop the pipeline. Lower ones only appear in the
      # issue of the daily security run and go with the next update pull request.
      - name: Audit dependencies, stop from high on
        run: bash scripts/audit.sh high

      - name: Test the security scripts
        run: npm run test:scripts

      - run: npm run format:check
      - run: npm run check:file-length
      - run: npm run lint
      - run: npm run build

  database:
    name: Database rules
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/test-database.sh

  e2e:
    name: Playwright
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  live:
    name: Settings of the live version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:dist
