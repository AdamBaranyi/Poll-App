version: 2

updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Zurich
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    assignees:
      - AdamBaranyi
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      # Angular major versions need `ng update` with its migrations.
      - dependency-name: '@angular/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'angular-eslint'
        update-types: ['version-update:semver-major']
      # TypeScript has to stay in the range Angular supports.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
      time: '06:00'
      timezone: Europe/Zurich
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    assignees:
      - AdamBaranyi
