<div class="fields" [formGroup]="form()">
  <div class="field name">
    <label for="survey-title">Survey name <span class="required" aria-hidden="true">*</span></label>
    <div class="control">
      <input
        id="survey-title"
        type="text"
        formControlName="title"
        maxlength="120"
        autocomplete="off"
        required
        [attr.aria-invalid]="!!errorOf('title')"
        [attr.aria-describedby]="errorOf('title') ? 'survey-title-error' : null"
      />
      <button type="button" class="clear" aria-label="Clear survey name" (click)="clear('title')">
        <img src="icons/trash.svg" alt="" width="18" height="20" />
      </button>
    </div>
    @if (errorOf('title'); as error) {
      <p id="survey-title-error" class="error">{{ error }}</p>
    }
  </div>

  <div class="field end-date">
    <label for="survey-end-date">Set end date <span class="optional">(optional)</span></label>
    <div class="control">
      <input
        id="survey-end-date"
        type="date"
        formControlName="endDate"
        [min]="today"
        [attr.aria-invalid]="!!errorOf('endDate')"
        [attr.aria-describedby]="errorOf('endDate') ? 'survey-end-date-error' : null"
      />
      <button type="button" class="clear" aria-label="Clear end date" (click)="clear('endDate')">
        <img src="icons/trash.svg" alt="" width="18" height="20" />
      </button>
    </div>
    @if (errorOf('endDate'); as error) {
      <p id="survey-end-date-error" class="error">{{ error }}</p>
    }
  </div>

  <div class="field category">
    <label for="survey-category">Category <span class="required" aria-hidden="true">*</span></label>
    <select
      id="survey-category"
      formControlName="category"
      required
      [attr.aria-invalid]="!!errorOf('category')"
      [attr.aria-describedby]="errorOf('category') ? 'survey-category-error' : null"
    >
      <option value="" disabled>Choose category</option>
      @for (category of categories; track category) {
        <option [value]="category">{{ category }}</option>
      }
    </select>
    @if (errorOf('category'); as error) {
      <p id="survey-category-error" class="error">{{ error }}</p>
    }
  </div>

  <div class="field description">
    <label for="survey-description">
      Describing text <span class="optional">(optional)</span>
    </label>
    <div class="control">
      <textarea
        id="survey-description"
        formControlName="description"
        rows="5"
        maxlength="500"
        [attr.aria-invalid]="!!errorOf('description')"
        [attr.aria-describedby]="errorOf('description') ? 'survey-description-error' : null"
      ></textarea>
      <button
        type="button"
        class="clear"
        aria-label="Clear describing text"
        (click)="clear('description')"
      >
        <img src="icons/trash.svg" alt="" width="18" height="20" />
      </button>
    </div>
    @if (errorOf('description'); as error) {
      <p id="survey-description-error" class="error">{{ error }}</p>
    }
  </div>
</div>
