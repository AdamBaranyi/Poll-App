<main class="home">
  <div class="page">
    <app-hero />
  </div>
  <section class="surveys" aria-labelledby="surveys-title">
    <h2 id="surveys-title">Your surveys</h2>
    @if (isLoading()) {
      <p class="message" role="status">Loading surveys …</p>
    } @else if (loadFailed()) {
      <p class="message" role="alert">The surveys could not be loaded. Please try again later.</p>
    } @else {
      <app-ending-soon [surveys]="surveys()" />
      <app-survey-list [surveys]="surveys()" />
    }
  </section>
</main>
